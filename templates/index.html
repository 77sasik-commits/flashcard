<!DOCTYPE html>
<html>
<head>
    <title>Flashcards</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div id="card-wrapper">
        <!-- 왼쪽 화살표 -->
        <button id="prevBtn" aria-label="Previous">
            <svg viewBox="0 0 24 24">
                <path d="M15 18l-6-6 6-6" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>

        <!-- 카드 컨테이너 -->
        <div id="card-container">
            {% for card in cards %}
            <div class="card">
                <div class="front">
                    <h2>{{ card['토픽'] }}</h2>
                </div>
                <div class="back">
                    <p><strong>[정의]</strong></p>
                    <p>{{ card['정의'] }}</p>
                    <p></p>
                    <p><strong>키워드:</strong></p>
                    <p>{{ card['키워드'] }}</p>
                    <p></p>
                    <p><strong>암기법:</strong></p>
                    <p>{{ card['암기법'] }}</p>
                    <p></p>
                </div>
            </div>
            {% endfor %}
        </div>

        <!-- 오른쪽 화살표 -->
        <button id="nextBtn" aria-label="Next">
            <svg viewBox="0 0 24 24">
                <path d="M9 6l6 6-6 6" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
